<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 223" width="364" height="223" role="img" aria-label="Ilustrasi perempuan berhijab melambai di depan laptop dengan kartu hadiah">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF4FF"/>
      <stop offset="1" stop-color="#DCEBFB"/>
    </linearGradient>
  </defs>
  <rect width="364" height="223" fill="url(#bg)"/>
  <!-- background clouds -->
  <circle cx="262" cy="86" r="76" fill="#CFE2F7"/>
  <path d="M30 168c-6-30 14-52 42-50 6-24 38-32 56-14 24-8 48 8 46 36l8 28H34z" fill="#D6E6F8"/>
  <path d="M150 190c0-26 20-44 46-42 8-20 36-24 50-6 24-2 40 16 38 48z" fill="#C6DBF3"/>

  <!-- gift card -->
  <rect x="56" y="50" width="106" height="78" rx="17" fill="#FFFFFF" stroke="#2F6FD0" stroke-width="2.5"/>
  <circle cx="141" cy="68" r="7" fill="#FF7A8A"/>
  <circle cx="148" cy="68" r="7" fill="#FF7A8A"/>
  <path d="M135 70l12 14 12-14z" fill="#FF7A8A" transform="translate(-4 -8) scale(1)"/>
  <!-- gift box -->
  <rect x="78" y="84" width="56" height="34" rx="3" fill="#F9C527"/>
  <rect x="75" y="76" width="62" height="12" rx="3" fill="#FBD43F"/>
  <rect x="100" y="76" width="12" height="42" fill="#2F6FD0"/>
  <path d="M106 76c-8-16-24-14-20-6 3 6 14 6 20 6zM106 76c8-16 24-14 20-6-3 6-14 6-20 6z" fill="none" stroke="#2F6FD0" stroke-width="5" stroke-linejoin="round"/>

  <!-- table -->
  <rect x="26" y="204" width="320" height="10" rx="5" fill="#C99A6B"/>
  <rect x="26" y="204" width="320" height="4" rx="2" fill="#DDB486"/>

  <!-- books -->
  <rect x="40" y="184" width="64" height="12" rx="2" fill="#2F6FD0"/>
  <rect x="44" y="187" width="56" height="3" fill="#CFE2F7"/>
  <rect x="38" y="196" width="68" height="9" rx="2" fill="#7B2D2D"/>
  <rect x="42" y="199" width="60" height="3" fill="#E8C9C0"/>
  <rect x="42" y="174" width="58" height="11" rx="2" fill="#3C80E0"/>
  <rect x="46" y="177" width="50" height="3" fill="#D8E8FA"/>

  <!-- mug -->
  <rect x="282" y="184" width="34" height="22" rx="4" fill="#2F6FD0"/>
  <path d="M316 189h5a6 6 0 010 12h-5" fill="none" stroke="#2F6FD0" stroke-width="4"/>
  <ellipse cx="299" cy="184" rx="17" ry="4" fill="#1F4FA0"/>

  <!-- body / shirt -->
  <path d="M170 204c-4-30 6-54 34-62l36-6c30 4 54 22 60 54l4 14z" fill="#2F6FD0"/>
  <path d="M200 142c-14 6-26 20-28 40l10 22h22z" fill="#1F58B8"/>
  <!-- forearm (waving) -->
  <path d="M170 150l-8-26c-1-4 4-6 6-3l9 16z" fill="#F6C9A8"/>
  <path d="M186 168l-14-24c-6-10 2-16 10-10l18 20z" fill="#2F6FD0"/>
  <!-- hand -->
  <g fill="#F6C9A8" stroke="#E0A77F" stroke-width="1">
    <rect x="165" y="95" width="6" height="22" rx="3" transform="rotate(-8 168 106)"/>
    <rect x="172" y="92" width="6" height="25" rx="3" transform="rotate(-3 175 104)"/>
    <rect x="179" y="95" width="6" height="22" rx="3" transform="rotate(5 182 106)"/>
    <rect x="186" y="101" width="6" height="18" rx="3" transform="rotate(14 189 110)"/>
    <path d="M164 112c-4 8 0 18 6 24l14 8c6 0 10-6 8-12l-2-22z"/>
  </g>

  <!-- hijab -->
  <path d="M196 70c0-24 18-42 42-42s44 18 44 44c0 24-4 48 10 70l-40 18-62-4c-6-20 6-36 6-60z" fill="#1B2F63"/>
  <path d="M204 150c20 14 54 14 70-6l16 26-52 14z" fill="#13224A"/>
  <path d="M238 28c-22 0-38 18-38 40 8-14 24-22 40-22 18 0 32 10 38 24 0-24-16-42-40-42z" fill="#243D7C"/>
  <!-- face -->
  <ellipse cx="240" cy="92" rx="30" ry="34" fill="#F6C9A8"/>
  <path d="M212 86c10-18 40-20 56-2-8-4-40-6-56 2z" fill="#1B2F63"/>
  <!-- eyes, brows, cheeks, mouth -->
  <path d="M224 90c2-3 6-3 8 0" fill="none" stroke="#2A1B14" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M248 90c2-3 6-3 8 0" fill="none" stroke="#2A1B14" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="228" cy="94" r="2.4" fill="#2A1B14"/>
  <circle cx="252" cy="94" r="2.4" fill="#2A1B14"/>
  <path d="M222 84q6-4 12-1M246 83q6-3 12 1" fill="none" stroke="#2A1B14" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="222" cy="104" r="5" fill="#F2A59A" opacity=".55"/>
  <circle cx="258" cy="104" r="5" fill="#F2A59A" opacity=".55"/>
  <path d="M232 106c4 10 14 10 18 0z" fill="#C8403F"/>
  <path d="M235 107c3 3 9 3 12 0z" fill="#FFFFFF"/>
  <path d="M240 96l-2 6h4z" fill="#E7AE8B"/>

  <!-- laptop -->
  <path d="M104 190l8-50c1-4 4-6 8-6h98c4 0 6 3 5 7l-10 49z" fill="#4A5A82"/>
  <path d="M110 188l7-46h92l-8 46z" fill="#5A6C99"/>
  <circle cx="164" cy="166" r="4" fill="#C9D3EA"/>
  <path d="M96 191h134c4 0 6 2 6 5v4c0 3-2 4-6 4H98c-4 0-6-1-6-4v-4c0-3 1-5 4-5z" fill="#2B3A60"/>
  <rect x="124" y="193" width="50" height="3" rx="1.5" fill="#46577F"/>
  <!-- hand on laptop -->
  <ellipse cx="226" cy="190" rx="14" ry="7" fill="#F6C9A8"/>
